[project]
name = "django-starter-kit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-cotton>=2.8.0",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-model-utils>=5.0.0",
    "django-widget-tweaks>=1.5.1",
    "gunicorn>=26.2.0",
    "pytailwindcss>=0.4.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
    "ruff>=0.17.3",
]
prod = [
    "gunicorn>=23.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".venv",
    "staticfiles",
    "static",
    "**/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.ruff.format]
quote-style = "double"
